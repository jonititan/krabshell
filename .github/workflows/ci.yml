name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Fast path: no krABMaga, no Bevy. This is what most changes need.
  default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: Gold replay of the drone pack
        run: cargo run --release -p sim-engine --bin simctl -- replay london-patrol --ticks 600

  # Spec §15 feature matrix: `gis` and `gis,parallel`. Slow, because `gis`
  # links Bevy; kept separate so the fast job reports first.
  krabmaga:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [krabmaga, parallel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}
      - name: Bevy's system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libfontconfig1-dev libxkbcommon-dev pkg-config
      - run: cargo clippy --workspace --all-targets --features sim-axum/${{ matrix.features }}
      - run: cargo test --workspace --features sim-axum/${{ matrix.features }}
      - name: Gold replay on the krABMaga backend
        run: cargo run --release -p sim-engine --features ${{ matrix.features }} --bin simctl -- --scenarios bench/scenarios --model walkers-krabmaga replay london-walkers --ticks 300
