name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Every build links krABMaga with `gis`, and so all of Bevy: the drones
  # model's agents run on it. Only the default build is checked for now; the
  # `parallel` (spec §15) entry is switched off below until it is wanted
  # again. Uncomment it to bring its full set of checks back.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            workspace: ""
            engine: ""
            drones: ""
          # - name: parallel
          #   workspace: --features sim-axum/parallel,sim-drones/parallel
          #   engine: --features parallel
          #   drones: --features parallel
    env:
      # Every test binary links all of Bevy; with full debuginfo they fill the
      # runner's disk and rust-lld dies with SIGBUS mid-link.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Bevy's system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libfontconfig1-dev libxkbcommon-dev pkg-config
      - if: matrix.name == 'default'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets ${{ matrix.workspace }}
      - run: cargo test --workspace ${{ matrix.workspace }}
      - name: Gold replay of the drone pack through the driver
        run: cargo run --release -p sim-engine ${{ matrix.engine }} --bin simctl -- replay london-patrol --ticks 600
      - name: Gold replay of the drone pack on krABMaga alone
        run: |
          run() { cargo run --release -p sim-drones ${{ matrix.drones }} --bin krab-drones -- scenarios/london-patrol --steps 600 | grep 'gold hash'; }
          first=$(run); second=$(run)
          echo "$first"
          test -n "$first" && test "$first" = "$second"
      - name: Gold replay of the walkers on krABMaga's grid
        run: cargo run --release -p sim-engine ${{ matrix.engine }} --bin simctl -- --scenarios bench/scenarios --model walkers-krabmaga replay london-walkers --ticks 300
