[workspace]
resolver = "2"
members = [
    "crates/sim-core",
    "crates/sim-drones",
    "crates/sim-engine",
    "crates/sim-mavlink",
    "crates/sim-cot",
    "crates/sim-axum",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/jonititan/krabshell"

[workspace.dependencies]
sim-core = { path = "crates/sim-core" }
sim-drones = { path = "crates/sim-drones" }
sim-engine = { path = "crates/sim-engine" }
sim-mavlink = { path = "crates/sim-mavlink" }
sim-cot = { path = "crates/sim-cot" }

# A5 cell maths. Pinned to the same major as `bevy_a5` 0.1 so that cell ids
# produced here are byte-identical to the ones krABMaga's SparseA5Grid stores.
a5 = "0.7"
# Pure-Rust maths, so flight and sensor trig give the same bits on every
# platform and gold replays agree between machines.
libm = "0.2.16"
# MAVLink v2 for the drone gateway. `mav2-message-extensions` is required:
# without it the generated messages lack `mission_type`, and QGroundControl
# drops mission replies that do not echo it.
mavlink = { version = "0.18", default-features = false, features = ["std", "dialect-common", "mav2-message-extensions", "serde"] }

anyhow = "1"
arc-swap = "1.9"
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
crossbeam-channel = "0.5"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "net"] }
toml = "1"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
lto = "thin"
codegen-units = 1

# The tick loop is the product. Never ship a debug-speed driver by accident:
# `cargo run` in dev still optimises the engine and its maths dependencies.
[profile.dev.package.sim-engine]
opt-level = 3
[profile.dev.package.sim-drones]
opt-level = 3
[profile.dev.package.a5]
opt-level = 3
