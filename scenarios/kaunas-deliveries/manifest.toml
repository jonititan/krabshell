# Parcel delivery drones over Kaunas, Lithuania, flying from the roofs of two
# shopping centres: Mega in Šilainiai (roof 81 m above sea level) and
# Akropolis in the Nemunas valley (46 m). 34502 real street addresses within
# 5 km order at random; orders queue at the nearer hub, and each hub's twenty
# drones are dispatched to the oldest order as they come ready. One spare per
# hub waits on its pad for a ground station. A delivery is a
# terrain-following flight to the address, a hover while DO_WINCH lowers the
# parcel and stows the line, and a flight back to land on the roof pad, where
# the drone is loaded and charged before it takes the next order. A drone whose
# battery runs flat before it lands crashes: the wreck is logged and taken out
# of the world, its parcel goes back to the front of the queue, and the hub's
# spare takes over its duty, or once the spare is gone a new drone arrives on
# the wreck's pad (agent ids and MAVLink system ids are never reused). Occupancy is at resolution 15
# (about 180 m cells). Gold profile.
#
# world/agents.json and world/fields.json are generated by
# tools/kaunas_deliveries.py from OpenStreetMap addresses (© OpenStreetMap
# contributors, ODbL 1.0) and Copernicus DEM GLO-30 terrain (© DLR e.V.
# 2010-2014 and © Airbus Defence and Space GmbH 2014-2018, provided under
# COPERNICUS by the European Union and ESA; all rights reserved).
