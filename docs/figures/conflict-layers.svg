<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d">
<title id="t">Altitude layers</title><desc id="d">Left: the airspace's standard layers, 1 000 ft deep below 28 500 ft and 2 000 ft from there up, placed so each flight level is inside its layer. Right: the drones' 30 m layers; a drone at 60 m with its 15 m vertical buffer covers two layers.</desc>
