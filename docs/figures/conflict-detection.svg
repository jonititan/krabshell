<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d">
<title id="t">Two drones head-on: summed probability by cell</title><desc id="d">Two drones 1.2 km apart flying at each other at 60 m and 10 m/s. Each cell is shaded by the probabilities both drones put in it, summed. 20 s ahead their clouds are apart; 40 s ahead one cell holds 1.31 aircraft and is a conflict; 60 s ahead six cells are.</desc>
