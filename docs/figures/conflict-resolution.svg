<title id="t">Height over the next minute, before and after the advisory</title><desc id="d">UAV 1 is advised to climb at 2.5 m/s. After its response delay it rises out of the shared layers, so by the first conflict at 40 s the two are layers apart. Bands are the 5th to 95th percentile of the particles' heights.</desc>
