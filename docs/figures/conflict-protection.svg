<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="t d">
<title id="t">A manned aircraft's protected volume on the grid</title><desc id="d">An airliner at 1000 m. Left, from above: the A5 cells (resolution 15, about 178 m) whose centres are within 300 m of it make its volume. A drone counts only the cell it is in: one 230 m away is inside, one 450 m away is outside, and the cell and ring it keeps from other drones do not count against the airliner. Right, from the side: the 30 m layers within 150 m above and below, 840 to 1170 m.</desc>
