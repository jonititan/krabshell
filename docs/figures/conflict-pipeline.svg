<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" width="780" height="200" role="img" aria-labelledby="t d">
<title id="t">How sim-conflict assesses aircraft</title><desc id="d">Aircraft states go through three stages: predict each aircraft as a cloud of particles counted into cells and layers; detect cells where two or more aircraft sum to the threshold; resolve by predicting each candidate manoeuvre again and advising the one that removes most risk, repeating until nothing is in conflict.</desc>
<style>
svg{--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--surface:#ffffff;--box:#f6f7f9;--s1:#2a78d6;--s2:#eb6834;--bad:#d03b3b;--cost:#c3c2b7;--q1:#cde2fb;--q2:#9ec5f4;--q3:#6da7ec;--q4:#3987e5;--q5:#1c5cab;--o1:#86b6ef;--o2:#3987e5;--o3:#1c5cab;--o4:#0d366b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){svg{--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--surface:#171b21;--box:#1f242b;--s1:#3987e5;--s2:#d95926;--bad:#e66767;--cost:#5a5955;--q1:#184f95;--q2:#1c5cab;--q3:#2a78d6;--q4:#6da7ec;--q5:#b7d3f6;--o1:#184f95;--o2:#256abf;--o3:#5598e7;--o4:#b7d3f6}}
text{fill:var(--ink);font-size:13px}
.t2{fill:var(--ink2)} .tm{fill:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.h{font-weight:600} .small{font-size:12px}
.halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.grid{stroke:var(--grid);stroke-width:1} .axis{stroke:var(--axis);stroke-width:1}
</style>
<rect x="2.0" y="12" width="136" height="90" rx="8" fill="var(--box)" stroke="var(--axis)" stroke-width="1"/>
<text x="14.0" y="36.0" text-anchor="start" class="h">Aircraft states</text>
<text x="14.0" y="58.0" text-anchor="start" class="small t2">position, height,</text>
<text x="14.0" y="73.0" text-anchor="start" class="small t2">speed, heading,</text>
<text x="14.0" y="88.0" text-anchor="start" class="small t2">climb and turn</text>
<line x1="141.0" y1="57.0" x2="156.0" y2="57.0" stroke="var(--ink2)" stroke-width="1.5"/>
<path d="M162.0,57.0 l-7,-4 v8z" fill="var(--ink2)"/>
<rect x="162.0" y="12" width="136" height="90" rx="8" fill="var(--box)" stroke="var(--s1)" stroke-width="1.5"/>
<text x="174.0" y="36.0" text-anchor="start" class="h">1  Predict</text>
<text x="174.0" y="58.0" text-anchor="start" class="small t2">200 particles,</text>
<text x="174.0" y="73.0" text-anchor="start" class="small t2">12 steps of 5 s,</text>
<text x="174.0" y="88.0" text-anchor="start" class="small t2">counted into cells</text>
<line x1="301.0" y1="57.0" x2="316.0" y2="57.0" stroke="var(--ink2)" stroke-width="1.5"/>
<path d="M322.0,57.0 l-7,-4 v8z" fill="var(--ink2)"/>
<rect x="322.0" y="12" width="136" height="90" rx="8" fill="var(--box)" stroke="var(--s1)" stroke-width="1.5"/>
<text x="334.0" y="36.0" text-anchor="start" class="h">2  Detect</text>
<text x="334.0" y="58.0" text-anchor="start" class="small t2">sum each cell;</text>
<text x="334.0" y="73.0" text-anchor="start" class="small t2">2+ aircraft and</text>
<text x="334.0" y="88.0" text-anchor="start" class="small t2">sum ≥ 1: conflict</text>
<line x1="461.0" y1="57.0" x2="476.0" y2="57.0" stroke="var(--ink2)" stroke-width="1.5"/>
<path d="M482.0,57.0 l-7,-4 v8z" fill="var(--ink2)"/>
<rect x="482.0" y="12" width="136" height="90" rx="8" fill="var(--box)" stroke="var(--s1)" stroke-width="1.5"/>
<text x="494.0" y="36.0" text-anchor="start" class="h">3  Resolve</text>
<text x="494.0" y="58.0" text-anchor="start" class="small t2">try 7 manoeuvres,</text>
<text x="494.0" y="73.0" text-anchor="start" class="small t2">advise the best,</text>
<text x="494.0" y="88.0" text-anchor="start" class="small t2">then again</text>
<line x1="621.0" y1="57.0" x2="636.0" y2="57.0" stroke="var(--ink2)" stroke-width="1.5"/>
<path d="M642.0,57.0 l-7,-4 v8z" fill="var(--ink2)"/>
<rect x="642.0" y="12" width="136" height="90" rx="8" fill="var(--box)" stroke="var(--axis)" stroke-width="1"/>
<text x="654.0" y="36.0" text-anchor="start" class="h">Advisories</text>
<text x="654.0" y="58.0" text-anchor="start" class="small t2">and the pairs</text>
<text x="654.0" y="73.0" text-anchor="start" class="small t2">left unresolved</text>
<path d="M550.0,104 C550.0,164 230.0,164 230.0,110" fill="none" stroke="var(--s1)" stroke-width="1.5"/>
<path d="M230.0,104 l-4,8 h8z" fill="var(--s1)"/>
<text x="390.0" y="164.0" text-anchor="middle" class="small t2">predict again, flying each candidate manoeuvre</text>
</svg>
