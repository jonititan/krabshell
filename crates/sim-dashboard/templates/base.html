<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}krabshell{% endblock %}</title>
<link rel="stylesheet" href="/assets/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>&#129408;</text></svg>">
<script src="/assets/htmx.min.js" defer></script>
<script>
  // Page width (normal, wide, full) is the operator's choice, kept per browser.
  // Set before the body renders so the page does not jump.
  try {
    const width = localStorage.getItem('krabshell.width');
    if (width) document.documentElement.dataset.width = width;
  } catch (_) {}
</script>
</head>
<body>
<header class="topbar">
  <a class="wordmark" href="/run">krab<span>shell</span></a>
  <nav>
    <a href="/run" {% if nav == "run" %}class="on"{% endif %}>Run</a>
    <a href="/scenarios" {% if nav == "scenarios" %}class="on"{% endif %}>Scenarios</a>
    <a href="/state" {% if nav == "state" %}class="on"{% endif %}>State</a>
    <a href="/geofences" {% if nav == "geofences" %}class="on"{% endif %}>Geofences</a>
    <a href="/stations" {% if nav == "stations" %}class="on"{% endif %}>Stations &amp; regions</a>
    <a href="/weather" {% if nav == "weather" %}class="on"{% endif %}>Weather</a>
    <a href="/conflicts" {% if nav == "conflicts" %}class="on"{% endif %}>Conflicts</a>
    <a href="/intents" {% if nav == "intents" %}class="on"{% endif %}>Intents</a>
    <a href="/io" {% if nav == "io" %}class="on"{% endif %}>Import / export</a>
    <a href="/docs" {% if nav == "docs" %}class="on"{% endif %}>Docs</a>
  </nav>
  <label class="page-width">Width
    <select id="page-width" aria-label="Page width">
      <option value="">Normal</option>
      <option value="wide">Wide</option>
      <option value="full">Full</option>
    </select>
  </label>
  <form method="post" action="/logout" class="logout">
    <button type="submit" class="ghost">Sign out</button>
  </form>
</header>

<main>
{% block content %}{% endblock %}
</main>

<script>
  (() => {
    const select = document.getElementById('page-width');
    select.value = document.documentElement.dataset.width || '';
    select.addEventListener('change', () => {
      if (select.value) document.documentElement.dataset.width = select.value;
      else delete document.documentElement.dataset.width;
      try { localStorage.setItem('krabshell.width', select.value); } catch (_) {}
    });
  })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
