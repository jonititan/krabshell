[package]
name = "sim-axum"
description = "HTTP and WebSocket edge, operator dashboard, and the krabshell binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
krabmaga = ["sim-engine/krabmaga"]
parallel = ["sim-engine/parallel"]

[dependencies]
sim-core.workspace = true
sim-engine.workspace = true
sim-mavlink.workspace = true
sim-cot.workspace = true
anyhow.workspace = true
askama = "0.16"
axum.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
futures-util.workspace = true
serde_urlencoded = "0.7"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.29"
zip = { version = "8", default-features = false, features = ["deflate"] }

[[bin]]
name = "krabshell"
path = "src/main.rs"
