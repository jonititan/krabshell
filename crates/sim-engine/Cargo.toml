[package]
name = "sim-engine"
description = "The simulation driver: one OS thread that owns the world and never awaits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# krABMaga's parallel schedule and thread-safe grid.
parallel = ["krabmaga/parallel", "sim-drones/parallel"]

[dependencies]
sim-core.workspace = true
sim-drones.workspace = true
a5.workspace = true
anyhow.workspace = true
arc-swap.workspace = true
clap.workspace = true
libm.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true
zip = { version = "8", default-features = false, features = ["deflate"] }

# The drones model's agents run on krABMaga (through sim-drones), and
# `walkers-krabmaga` uses its SparseA5Grid. `gis` links Bevy; see
# docs/baseline.md.
krabmaga = { version = "0.6.2", features = ["gis"] }

[[bin]]
name = "simctl"
path = "src/bin/simctl.rs"
